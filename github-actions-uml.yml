# Pretty Good UML for GitHub Actions.
#
# Copy this file to .github/workflows/uml.yml in your repository and set SOLUTION below.
# On every pull request it finds the endpoints whose request flow changed and posts one
# comment with a summary and a sequence diagram per endpoint. Later pushes update that comment.
#
# Public repositories need nothing else.
# Private repositories: add the repository (or organization) secret UML_LICENSE with your
# licence key. Without it the report shows the first endpoint only.
#
# The job never fails the pull request: if the tool cannot run, the checks stay green.

name: UML diff

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  SOLUTION: MySolution.sln   # path to your .sln / .slnx

jobs:
  uml-diff:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the full history, to compare with the base branch

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Pretty Good UML
        run: dotnet tool install PrettyGood.Uml --tool-path "$RUNNER_TEMP/uml-tool"

      - name: Restore the solution
        run: dotnet restore "$SOLUTION"

      - name: Compare with the base branch
        env:
          UML_LICENSE: ${{ secrets.UML_LICENSE }}
        run: >
          "$RUNNER_TEMP/uml-tool/pretty-good-uml" diff
          --project "$SOLUTION"
          --base "origin/${{ github.base_ref }}"
          --out "$RUNNER_TEMP/uml-report.md"

      - name: Show the report in the run summary
        run: cat "$RUNNER_TEMP/uml-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the pull request comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const body = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'uml-report.md'), 'utf8');
            const marker = '<!-- pretty-good-uml -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
